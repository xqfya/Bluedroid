name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel 4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path build/bin/BlueDroidEmulator.exe,packaging/defaults/emulator.ini,packaging/defaults/emulators.ini,version.json -Destination dist
          Compress-Archive -Path dist/* -DestinationPath "BlueDroid-${{ github.ref_name }}-win-${{ matrix.arch }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: package-win-${{ matrix.arch }}
          path: BlueDroid-*.zip

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file \
            libsdl2-dev libcurl4-openssl-dev libgl1-mesa-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4

      - name: Build AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp build/bin/BlueDroidEmulator AppDir/usr/bin/
          cp packaging/defaults/emulator.ini packaging/defaults/emulators.ini version.json AppDir/usr/bin/
          cp packaging/bluedroid.svg AppDir/usr/share/icons/hicolor/256x256/apps/bluedroid.svg
          cp packaging/bluedroid.svg AppDir/usr/share/icons/hicolor/scalable/apps/bluedroid.svg
          cp packaging/bluedroid.svg AppDir/bluedroid.svg

          cat > AppDir/BlueDroid.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=BlueDroid
          Exec=BlueDroidEmulator
          Icon=bluedroid
          Categories=Utility;
          Terminal=false
          DESKTOP
          cp AppDir/BlueDroid.desktop AppDir/usr/share/applications/BlueDroid.desktop

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$HERE/usr/bin:${PATH:-}"
          cd "$HERE/usr/bin"
          exec "$HERE/usr/bin/BlueDroidEmulator" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Bundle non-system shared libraries next to the executable.
          for lib in $(ldd build/bin/BlueDroidEmulator | awk '/=> \// {print $3}'); do
            case "$lib" in
              *libc.so*|*libm.so*|*libpthread.so*|*libdl.so*|*librt.so*|*libgcc_s.so*) continue ;;
            esac
            cp "$lib" AppDir/usr/lib/ || true
          done

          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          ARCH="$APPIMAGE_ARCH" ./squashfs-root/AppRun AppDir \
            "BlueDroid-${{ github.ref_name }}-linux-${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: BlueDroid-*.AppImage

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install sdl2 curl dylibbundler

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix curl)"
          cmake --build build --parallel 4

      - name: Build app bundle and DMG
        run: |
          set -euo pipefail
          APP="dist/BlueDroid.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp build/bin/BlueDroidEmulator "$APP/Contents/MacOS/BlueDroidEmulator.bin"
          cp packaging/defaults/emulator.ini packaging/defaults/emulators.ini version.json "$APP/Contents/MacOS/"
          cp packaging/bluedroid.svg "$APP/Contents/Resources/BlueDroid.svg"

          cat > "$APP/Contents/MacOS/BlueDroidEmulator" <<'LAUNCH'
          #!/bin/sh
          cd "$(dirname "$0")"
          exec "./BlueDroidEmulator.bin" "$@"
          LAUNCH
          chmod +x "$APP/Contents/MacOS/BlueDroidEmulator"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BlueDroid</string>
            <key>CFBundleDisplayName</key><string>BlueDroid</string>
            <key>CFBundleIdentifier</key><string>com.bluedroid.manager</string>
            <key>CFBundleExecutable</key><string>BlueDroidEmulator</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST

          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/BlueDroidEmulator.bin" \
            -d "$APP/Contents/Frameworks" \
            -p @executable_path/../Frameworks/

          codesign --force --deep --sign - "$APP"
          hdiutil create -volname BlueDroid -srcfolder "$APP" -ov -format UDZO \
            "BlueDroid-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: BlueDroid-*.dmg

  release:
    name: Publish GitHub release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp version.json artifacts/
          gh release create "$TAG" artifacts/* \
            --title "BlueDroid $TAG" \
            --generate-notes \
            --verify-tag
